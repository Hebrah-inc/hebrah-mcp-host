# Optional: fire a repository_dispatch event when INFRA_DISPATCH_REPO and
# HEBRAH_INFRA_DISPATCH_TOKEN are configured in repository settings.

name: trigger-staging-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: ${{ vars.INFRA_DISPATCH_REPO != '' }}
    steps:
      - name: Trigger deploy dispatch
        env:
          HEBRAH_INFRA_DISPATCH_TOKEN: ${{ secrets.HEBRAH_INFRA_DISPATCH_TOKEN }}
          INFRA_DISPATCH_REPO: ${{ vars.INFRA_DISPATCH_REPO }}
        run: |
          if [ -z "${HEBRAH_INFRA_DISPATCH_TOKEN}" ]; then
            echo "Skipping dispatch: HEBRAH_INFRA_DISPATCH_TOKEN not set"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${HEBRAH_INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${INFRA_DISPATCH_REPO}/dispatches" \
            -d "{\"event_type\": \"staging-deploy\", \"client_payload\": {\"source\": \"hebrah-mcp-host\", \"sha\": \"${{ github.sha }}\"}}"
          echo "Dispatched staging-deploy from hebrah-mcp-host @ ${GITHUB_SHA}"

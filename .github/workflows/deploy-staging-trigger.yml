# Fire a repository_dispatch event to hebrah-infra on push to main.
# See hebrah-api/.github/workflows/deploy-staging-trigger.yml for setup.

name: trigger-staging-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy in hebrah-infra
        env:
          HEBRAH_INFRA_DISPATCH_TOKEN: ${{ secrets.HEBRAH_INFRA_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${HEBRAH_INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Hebrah-inc/hebrah-infra/dispatches \
            -d "{\"event_type\": \"staging-deploy\", \"client_payload\": {\"source\": \"hebrah-mcp-host\", \"sha\": \"${{ github.sha }}\"}}"
          echo "Dispatched staging-deploy from hebrah-mcp-host @ ${GITHUB_SHA}"
